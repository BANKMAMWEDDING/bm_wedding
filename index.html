        @keyframes twinkle {

        /* --- 🎬 IMAGE SLIDING DOORS REVEAL 🎬 --- */
        .door-panel {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            z-index: 100;
            will-change: transform;
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1) 0.5s;
            overflow: hidden; /* สำคัญ: เพื่อซ่อนส่วนที่ล้นออกไปของรูปภาพ */
            background-color: #4A3C35; /* สีพื้นหลังระหว่างรอรูปโหลด */
        }

        /* สร้างเลเยอร์รูปภาพให้กว้างเต็มจอ (100vw) เพื่อให้รูปสมส่วนเสมอ */
        .door-panel::before {
            content: '';
            position: absolute;
            top: 0;
            width: 100vw; 
            height: 100%;
            background-image: url('https://wsrv.nl/?url=https://i.ibb.co/mr2BHdvd/LMT-4283.jpg&w=2000&output=webp&q=85');
            background-size: cover; 
            
            /* ✨ ล็อกจุดโฟกัสไว้ตรงกลาง-บนสุด เพื่อป้องกันหัวขาด */
            background-position: center 15%; 
            
            background-repeat: no-repeat;
        }

        /* ดึงรูปซีกซ้ายมาแสดงที่ประตูบานซ้าย */
        .door-left::before {
            left: 0;
        }

        /* ดึงรูปซีกขวามาแสดงที่ประตูบานขวา */
        .door-right::before {
            right: 0;
        }

        /* Overlay สีดำจางๆ ทับรูปประตูเพื่อให้ตัวหนังสือด้านบนอ่านง่ายขึ้น */
        .door-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2); /* ปรับระดับความมืดของฟิลเตอร์ดำ */
        }

        .door-left {
            left: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.3);

        .door-right {
            right: 0;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.3);
        }
        .door-left-open {
            transform: translateX(-105%);
        }
        .door-right-open {
            transform: translateX(105%);
        }

        .cover-content {
            transition: all 0.8s ease-in-out;
            z-index: 120;
        }
        .cover-content-hidden {
            opacity: 0;
            transform: scale(1.1) translateY(-20px);
            pointer-events: none;
        }

        /* Wax Seal Style (Burgundy Red Theme) */
        .wax-seal {
            /* ไล่สีแดงเบอร์กันดีให้ดูมีมิติแสงเงา */

        /* --- Reveal Animations for content --- */
        .reveal { opacity: 0; transform: translateY(40px); transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); will-change: opacity, transform; }
        .reveal-scale { opacity: 0; transform: scale(0.95) translateY(30px); transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); will-change: opacity, transform; }
